cucumber.publish.quiet=true

# Run scenarios from different feature files concurrently. Scenarios within
# the same feature file still run sequentially by default. See DriverFactory
# for why this needed a ThreadLocal<WebDriver> before it was safe to turn on.
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
